name: Windows desktop validation

on:
  workflow_dispatch:
  push:
    branches:
      - security-hardening
      - windows-desktop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.build-venv\Scripts\python.exe -m pip install -r backend\requirements-build.txt

      - name: Run cross-platform regression suite
        run: pnpm test

      - name: Verify native Windows OCR
        run: pnpm run test:ocr:windows

      - name: Build Windows backend and installer
        run: |
          pnpm run build:win
          pnpm run dist:win

      - name: Verify the packaged backend
        run: pnpm run test:packaged

      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: tomorrow-now-pdf-editor-windows-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Tomorrow-Now-PDF-Editor-*-Windows-x64.exe
            release/Tomorrow-Now-PDF-Editor-*-Windows-x64.zip
            release/latest.yml
